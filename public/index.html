<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCA Department Alert System</title>
  
  <!-- PWA Manifest & Theme Color -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7b2cbf">

  <!-- Style CSS -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f4f6f9; color: #333; line-height: 1.6; }
    .header { background: linear-gradient(135deg, #7b2cbf, #9d4edd); color: white; padding: 30px 20px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .header h1 { font-size: 24px; margin-bottom: 5px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .container { max-width: 450px; margin: -20px auto 30px; padding: 0 15px; }
    .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #444; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; transition: border-color 0.3s; }
    input:focus, select:focus { border-color: #7b2cbf; outline: none; }
    .btn { width: 100%; background: #7b2cbf; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
    .btn:hover { background: #9d4edd; }
    #statusMsg { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; display: none; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>

  <!-- 🔔 OneSignal Web Push SDK (v16) -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "d2ced897-0702-4d42-a341-8c9e0821cc6f",
        notifyButton: {
          enable: true,             /* 👈 Bell Icon ऑन करण्यासाठी */
          size: 'medium',           /* Small, Medium, किंवा Large */
          theme: 'default',
          position: 'bottom-right', /* स्क्रीनवर उजव्या कोपऱ्यात दिसेल */
        },
        allowLocalhostAsSecureOrigin: true,
      });

      // 🚀 युझरने अजून Allow केले नसेल, तर ऑटोमॅटिक Permission Prompt दाखवा
      if (OneSignal.Notifications.permission !== "granted") {
        await OneSignal.Notifications.requestPermission();
      }
    });
  </script>
</head>
<body>

  <div class="header">
    <h1>🎓 BCA Alert System</h1>
    <p>Get Instant Timetable & Notice Alerts on Your Phone!</p>
  </div>

  <div class="container">
    <div class="card">
      <form id="subscribeForm">
        <div class="form-group">
          <label for="name">Full Name (पूर्ण नाव)</label>
          <input type="text" id="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="enroll_no">Enrollment Number (उदा. GHRUA25011140001)</label>
          <input type="text" id="enroll_no" placeholder="GHRUA2501114..." required>
        </div>

        <div class="form-group">
          <label for="sem">Semester (सेमिस्टर)</label>
          <select id="sem" required>
            <option value="">Select Semester</option>
            <option value="Sem 1">Sem 1</option>
            <option value="Sem 2">Sem 2</option>
            <option value="Sem 3">Sem 3</option>
            <option value="Sem 4">Sem 4</option>
            <option value="Sem 5">Sem 5</option>
            <option value="Sem 6">Sem 6</option>
          </select>
        </div>

        <div class="form-group">
          <label for="phone">Mobile Number (व्हॉट्सॲप / टेलिफोन)</label>
          <input type="tel" id="phone" placeholder="10 Digit Mobile Number" required pattern="[0-9]{10}">
        </div>

        <button type="submit" class="btn">🚀 REGISTER FOR ALERTS</button>
      </form>

      <div id="statusMsg"></div>
    </div>
  </div>

  <script>
    // Registration Form JS
    document.getElementById("subscribeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const statusMsg = document.getElementById("statusMsg");
      statusMsg.style.display = "none";

      const name = document.getElementById("name").value.trim();
      const enroll_no = document.getElementById("enroll_no").value.trim();
      const sem = document.getElementById("sem").value;
      const phone = document.getElementById("phone").value.trim();

      try {
        const res = await fetch("/api/subscribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, enroll_no, sem, phone })
        });

        if (res.ok) {
          statusMsg.className = "success";
          statusMsg.innerText = "✅ रजिस्ट्रेशन यशस्वीरित्या पूर्ण झाले! तुम्हाला आता सर्व अलर्ट्स मिळतील.";
          statusMsg.style.display = "block";
          document.getElementById("subscribeForm").reset();
        } else if (res.status === 409) {
          statusMsg.className = "error";
          statusMsg.innerText = "⚠️ तुम्ही आधीच रजिस्टर झालेले आहात!";
          statusMsg.style.display = "block";
        } else if (res.status === 403) {
          statusMsg.className = "error";
          statusMsg.innerText = "❌ अमान्य एनरोलमेंट नंबर!";
          statusMsg.style.display = "block";
        } else {
          statusMsg.className = "error";
          statusMsg.innerText = "❌ काहीतरी चुकीचे घडले, कृपया नंतर प्रयत्न करा.";
          statusMsg.style.display = "block";
        }
      } catch (err) {
        statusMsg.className = "error";
        statusMsg.innerText = "❌ सर्व्हरशी संपर्क होऊ शकला नाही.";
        statusMsg.style.display = "block";
      }
    });
  </script>

</body>
</html>
